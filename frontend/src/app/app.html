<nav class="app-nav" aria-label="Primary">
  <img class="app-nav__brand" src="logo.svg" [alt]="appName" />
  @for (destination of destinations; track destination.path) {
    @let count = badgeCount(destination.path);
    <a
      class="app-nav__link"
      routerLinkActive="app-nav__link--active"
      #active="routerLinkActive"
      [routerLink]="['/', destination.path]"
      [attr.aria-current]="active.isActive ? 'page' : null"
      [attr.aria-label]="count ? destination.label + ', ' + count + ' to review' : null"
    >
      <mat-icon aria-hidden="true" [matBadge]="count" [matBadgeHidden]="!count" matBadgeSize="small">{{
        destination.icon
      }}</mat-icon>
      <span class="app-nav__label">{{ destination.label }}</span>
    </a>
  }
</nav>

<div class="app-shell">
  <header class="app-bar">
    <div class="app-bar__heading">
      @if (showBackControl()) {
        <a class="app-bar__back" matIconButton [routerLink]="backTarget()" [attr.aria-label]="'Back to ' + backLabel()">
          <mat-icon>arrow_back</mat-icon>
        </a>
      }
      <h1 class="app-bar__title">{{ pageTitle() }}</h1>
    </div>
    <button
      matIconButton
      type="button"
      [attr.aria-label]="'Colour theme: ' + theme() + '. Click to switch.'"
      [matTooltip]="themeTooltip()"
      matTooltipPosition="left"
      (click)="cycleTheme()"
    >
      <mat-icon>{{ themeIcon() }}</mat-icon>
    </button>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
