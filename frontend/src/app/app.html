<nav class="app-nav" aria-label="Primary">
  <p class="app-nav__brand">{{ appName }}</p>
  @for (destination of destinations; track destination.path) {
    <a
      class="app-nav__link"
      routerLinkActive="app-nav__link--active"
      #active="routerLinkActive"
      [routerLink]="['/', destination.path]"
      [attr.aria-current]="active.isActive ? 'page' : null"
    >
      <mat-icon aria-hidden="true">{{ destination.icon }}</mat-icon>
      <span class="app-nav__label">{{ destination.label }}</span>
    </a>
  }
</nav>

<div class="app-shell">
  <header class="app-bar">
    <h1 class="app-bar__title">{{ pageTitle() }}</h1>
    <button
      matIconButton
      type="button"
      [attr.aria-label]="'Colour theme: ' + theme() + '. Click to switch.'"
      [matTooltip]="themeTooltip()"
      matTooltipPosition="left"
      (click)="cycleTheme()"
    >
      <mat-icon>{{ themeIcon() }}</mat-icon>
    </button>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
