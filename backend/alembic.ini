# Alembic configuration (DESIGN §5.2 plumbing, M0 PR4). Run from `backend/`:
#   alembic upgrade head            # apply migrations (M0: empty baseline only)
#   alembic revision --autogenerate # M0: produces an empty diff (no models yet)
#
# The database URL is intentionally NOT set here. `migrations/env.py` reads
# DATABASE_URL from the application config so nothing is hardcoded (NFR-MAINT-04).

[alembic]
# Path to migration scripts, relative to this file (DESIGN §4 repository layout).
script_location = migrations

# Put `backend/` on sys.path so env.py can `import app.*` when alembic runs.
prepend_sys_path = .

# Use OS-native path separators when rendering new revision filenames.
path_separator = os

# sqlalchemy.url is supplied at runtime by env.py from DATABASE_URL — see above.

# --- Logging -------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
