[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "film-rewatch-backend"
version = "1.0.0"
description = "Backend API for the Film Rewatch application (FastAPI)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.2",
    # Data-access plumbing (DESIGN §5.2, M0 PR4). The async-capable psycopg 3
    # driver matches the `postgresql+psycopg` URL in `.env.example`. No domain
    # tables yet — those (and their first migration) arrive in M1.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

# Developer tooling — not shipped in the wheel. uv's default `dev` group:
# `uv sync` installs it (with the app, editable) into `.venv` from the committed
# uv.lock, so every dev environment is reproducible (NFR-MAINT-04, REVIEW_M0
# §2.3; documented in the README, PR8). The Docker image skips it (`--no-dev`).
[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8",
    # Required by Starlette's TestClient, which the error-envelope tests use to
    # drive real requests through the app (PR5).
    "httpx2>=2",
    # Linter + formatter (REVIEW_M0 §4) — the backend half of the lint/format
    # gate the frontend already has (ESLint + Prettier). Config: [tool.ruff].
    "ruff>=0.15.21",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Strict static type-safety baseline (DESIGN §5.7). Pyright is the checker — the
# same engine as Pylance in the editor — so `make typecheck` and editor feedback
# agree. `strict` is enforced over the whole backend from M0's first commit.
[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
pythonPlatform = "Linux"

# Lint + format via Ruff (REVIEW_M0 §4), mirroring the strictness bar §5.7 sets
# for types: `make lint` / `make format-check` must be clean for every change,
# and the pre-commit hook enforces both on staged backend files.
# 100 chars (not the 88 default) because the codebase's heavily-documented
# style (design-§ citations in docstrings/comments) runs a little long; all
# existing code already fits, so the bump avoids noisy rewrapping.
[tool.ruff]
target-version = "py312" # matches requires-python / [tool.pyright]
line-length = 100

[tool.ruff.lint]
# Beyond the E/F defaults: W (pycodestyle warnings), I (import sorting),
# UP (modernise to 3.12 idioms), B (bugbear — likely-bug patterns), C4
# (comprehension cleanups), RUF (Ruff's own checks). All mainstream groups;
# nothing exotic or preview.
extend-select = ["W", "I", "UP", "B", "C4", "RUF"]
