[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "film-rewatch-backend"
version = "1.0.0"
description = "Backend API for the Film Rewatch application (FastAPI)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.2",
]

# Developer tooling — not shipped in the wheel. Install with `pip install -e .[dev]`
# (documented in the README, PR8). SQLAlchemy/Alembic land in PR4.
[project.optional-dependencies]
dev = [
    "pyright>=1.1.390",
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Strict static type-safety baseline (DESIGN §5.7). Pyright is the checker — the
# same engine as Pylance in the editor — so `make typecheck` and editor feedback
# agree. `strict` is enforced over the whole backend from M0's first commit.
[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
pythonPlatform = "Linux"
